<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DASHBOARD 1971 · 桌面卡片层</title>
  <link rel="stylesheet" href="theme.css" />
  <link rel="stylesheet" href="overlay.css" />
</head>
<body class="overlay edge-right" data-mode="collapsed">
  <div class="layer layer-cards" id="cardLayer"></div>

  <div class="layer layer-dock" id="dockLayer">
    <div class="dock interactive" id="dock">
      <div class="dock-ruler" aria-hidden="true"></div>

      <div class="deck" id="deckStack">
        <div class="deck-sheets" id="deckSheets" aria-hidden="true"></div>

        <div class="deck-face interactive" id="deckFace" role="button" tabindex="0"
             title="悬停：展开概览 · 点击：散布卡片 / 收回卡片">
          <div class="deck-head">
            <span class="deck-swatch" id="deckIndex"></span>
            <span class="deck-tag">DECK</span>
            <button class="head-toggle" data-act="simple" id="toolSimple" title="简化卡片：只留标题">简</button>
            <span class="spacer"></span>
            <span class="status-mark on" id="deckMark"></span>
          </div>
          <div class="deck-count num" id="deckCount">0</div>
          <div class="deck-name" id="deckName">收件箱</div>
          <div class="deck-meter-row">
            <div class="block-meter" id="deckMeter"></div>
            <span class="deck-ratio" id="deckRatio">0/0</span>
          </div>

          <div class="dock-tools" id="dockTools">
            <button class="tool" data-act="add" title="新建任务 (N)">＋</button>
            <button class="tool" data-act="layout" title="重新排布卡片">⟳</button>
            <button class="tool" data-act="dashboard" id="toolDashboard" title="打开任务面板">▤</button>
            <button class="tool" data-act="settings" title="打开设置">⚙</button>
            <button class="tool" data-act="pinall" id="toolPinAll" title="把本组所有卡片钉在桌面"><svg class="tool-pin" viewBox="0 0 24 24" aria-hidden="true"><path fill="#8d3a27" d="M9.2 2.6h5.6l-1 2.1v2.9l2.1 2v2.1h-4.4v6.9l-1.3 3.8-1.3-3.8v-6.9H4.5V9.6l2.1-2V4.7z"/></svg></button>
            <button class="tool" data-act="autotuck" id="toolAutoTuck" title="自动缩进屏幕边缘">⇤</button>
            <button class="tool" data-act="hide" title="隐藏桌面卡片层">▣</button>
          </div>
        </div>
      </div>

      <div class="group-chips" id="groupChips"></div>
    </div>
  </div>

  <div class="modal-root" id="modalRoot"></div>
  <div class="toast-root" id="toastRoot"></div>

  <script src="shared/lunar.js"></script>
  <script src="shared/data.js"></script>
    <script src="theme-apply.js"></script>
    <script src="modal-drag.js"></script>
  <script src="shared/nlp.js"></script>
  <script src="bridge.js"></script>
  <script src="agent.js"></script>
  <script src="planfield.js"></script>
  <script src="ui-sound.js"></script>
  <script src="receipt.js"></script>
  <script src="overlay.js"></script>
</body>
</html>
