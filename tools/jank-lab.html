<!doctype html>
<!-- Two measurements behind the two jank reports, taken in a browser so the app can stay open.

   A. does backdrop-filter on a dialog make scrolling the dialog expensive?
      The settings panel is a long scroll inside .modal-panel, which now carries
      backdrop-filter: blur(18px). Chromium re-samples the backdrop on every painted frame, so
      the question is whether that cost is per frame or per change.

   B. what does changing the sidebar width actually cost?
      The grid track is driven by --side-w on <body>. Every write re-layouts the main column,
      which holds container queries and a list of rows. The variants compare a plain re-layout,
      one with `contain: layout style` on the main column, and one where the resize is applied
      only on release.

   Open in a browser and press the buttons; each prints a median frame time. -->
<html>
<head>
<meta charset="utf-8" />
<style>
  html, body { margin: 0; height: 100%; font: 12px/1.5 system-ui; background: #f6f6f4; color: #14120d; }
  #bar { position: fixed; top: 0; left: 0; right: 0; z-index: 9; display: flex; gap: 6px; padding: 8px; background: #fff; border-bottom: 1px solid #999; }
  #out { position: fixed; right: 8px; bottom: 8px; z-index: 9; width: 320px; max-height: 40vh; overflow: auto;
         font: 11px/1.5 ui-monospace, monospace; background: #fff; border: 1px solid #000; padding: 8px; margin: 0; }
  .app { display: grid; grid-template-columns: var(--side-w, 286px) 1fr; height: 100vh; }
  .side { background: #e9e7df; border-right: 1px solid #999; overflow: hidden; }
  .main { overflow: auto; padding: 12px; }
  .main.contained { contain: layout style; }
  .row { display: flex; gap: 8px; padding: 7px 6px; border-bottom: 1px dashed #bbb; }
  .row b { font-size: 12.5px }
  .row span { margin-left: auto; color: #777 }
  .mask { position: fixed; inset: 0; background: rgba(0,0,0,.35); }
  .panel { position: relative; margin: 6vh auto 0; width: 540px; max-height: 84vh; overflow: auto;
           background: rgba(252,252,250,.82); border: 1px solid #333; }
  .panel.blur { -webkit-backdrop-filter: blur(18px) saturate(1.3); backdrop-filter: blur(18px) saturate(1.3); }
  .panel .sec { padding: 10px 12px; border-bottom: 1px solid #ddd; }
</style>
</head>
<body>
  <div id="bar">
    <button data-t="a-blur">A 有 backdrop-filter</button>
    <button data-t="a-noblur">A 无 backdrop-filter</button>
    <button data-t="b-plain">B 改宽度</button>
    <button data-t="b-contain">B 改宽度 + contain</button>
    <button data-t="b-none">B 只改一个无关变量</button>
  </div>
  <div class="app" id="app">
    <div class="side"><div style="padding:12px">分组</div></div>
    <div class="main" id="main"></div>
  </div>
  <div class="mask" id="mask" hidden><div class="panel" id="panel"></div></div>
  <pre id="out"></pre>
<script>
  var main = document.getElementById('main'), panel = document.getElementById('panel'), mask = document.getElementById('mask');
  var rows = '';
  for (var i = 0; i < 260; i++) rows += '<div class="row"><b>任务 ' + i + ' 一条足够长的标题用来排版</b><span>今天 18:15</span></div>';
  main.innerHTML = rows;
  var secs = '';
  for (var j = 0; j < 90; j++) secs += '<div class="sec">设置项 ' + j + ' —— 说明文字说明文字说明文字</div>';
  panel.innerHTML = secs;

  function median(a) { a = a.slice().sort(function (x, y) { return x - y; }); return a[Math.floor(a.length / 2)]; }
  /* one frame per rAF, and the work happens inside the frame, so the measured delta is the
     cost the compositor and the layout tree actually paid for it */
  function frames(n, work) {
    return new Promise(function (res) {
      var t = [], last = performance.now(), i = 0;
      function step() {
        work(i++);
        var now = performance.now();
        t.push(now - last); last = now;
        if (i < n) requestAnimationFrame(step); else res(median(t));
      }
      requestAnimationFrame(step);
    });
  }
  function scrollPanel(times, blur) {
    panel.classList.toggle('blur', blur);
    mask.hidden = false;
    panel.scrollTop = 0;
    return frames(times, function (i) { panel.scrollTop = (i * 7) % 900; }).then(function (m) {
      mask.hidden = true;
      return m;
    });
  }
  function resize(times, mode) {
    main.classList.toggle('contained', mode === 'contain');
    return frames(times, function (i) {
      if (mode === 'none') { document.body.style.setProperty('--unused', i + 'px'); return; }
      document.body.style.setProperty('--side-w', (240 + (i % 8) * 12) + 'px');
    }).then(function (m) { main.classList.remove('contained'); return m; });
  }
  function report(name, ms) {
    document.getElementById('out').textContent = name + ': 中位帧时 ' + ms.toFixed(2) + ' ms\n' +
      document.getElementById('out').textContent;
  }
  document.getElementById('bar').addEventListener('click', function (ev) {
    var t = ev.target.dataset.t;
    if (!t) return;
    var p = t === 'a-blur' ? scrollPanel(120, true)
      : t === 'a-noblur' ? scrollPanel(120, false)
      : t === 'b-plain' ? resize(120, 'plain')
      : t === 'b-contain' ? resize(120, 'contain') : resize(120, 'none');
    p.then(function (m) { report(t, m); });
  });
</script>
</body>
</html>
