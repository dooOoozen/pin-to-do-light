<!doctype html>
<!-- A pick-list page. Two questions the developer asked to be shown rather than described:

   1. group colours — four candidate palettes, twelve slots each, rendered as the app renders
      them (dot, title, ledger bar) on both the day and the night plate. The current set reads
      too grey, and the hour may only change lightness and saturation, never the hue.
   2. the running-task animation — five variants, all of them the row's own container, since
      the current one is too subtle and too fast.

   Open in a browser. Nothing here is wired to the app; the winning choice gets copied into
   src/shared/data.js (PALETTE) or src/dashboard.css (the running-row rules). -->
<html>
<head>
<meta charset="utf-8" />
<title>分组配色 / 计时动效 备选</title>
<style>
  body { margin: 0; padding: 18px; font: 12px/1.5 "Segoe UI", system-ui, sans-serif; background: #cfcbc2; color: #14120d; }
  h2 { font-size: 13px; letter-spacing: .12em; text-transform: uppercase; margin: 22px 0 8px; }
  .row2 { display: flex; gap: 14px; flex-wrap: wrap; }
  .plate { width: 380px; padding: 10px; border: 1px solid #14120d33; }
  .plate.day { background: #f7f6f2; }
  .plate.night { background: #232019; color: #ddd8cc; border-color: #8a6f22; }
  .dots { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 8px; }
  .dot { width: 15px; height: 15px; border-radius: 50%; border: 1px solid #0003; }
  .night .dot { border-color: #fff3; }
  .name { font-size: 10px; letter-spacing: .1em; text-transform: uppercase; opacity: .65; margin-bottom: 6px; }
  .item { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-bottom: 1px dashed #0002; }
  .night .item { border-color: #fff2; }
  .item .lbl { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item .bar { width: 90px; height: 8px; background: #0002; overflow: hidden; }
  .night .item .bar { background: #fff2; }
  .item .bar i { display: block; height: 100%; }
  .item .v { font: 11px ui-monospace, monospace; opacity: .7; width: 62px; text-align: right; }
  .swatch { font: 10px ui-monospace, monospace; opacity: .55; margin-top: 6px; line-height: 1.7; }
  /* ---- the running-row variants ---- */
  .run { position: relative; display: flex; align-items: center; gap: 8px; padding: 7px 8px;
         border-bottom: 1px dashed #0002; overflow: hidden; }
  .run .lbl { flex: 1; position: relative; z-index: 2; }
  @keyframes v1 { 0%,100% { opacity: .35 } 50% { opacity: 1 } }
  .v1 { background: #d9a05b3d; box-shadow: inset 3px 0 0 #c96f4e; }
  .v1::after { content: ""; position: absolute; inset: 0; background: #c96f4e42; animation: v1 4.6s ease-in-out infinite; }
  .v2 { background: #d9a05b3d; }
  .v2::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: #c96f4e;
                transform-origin: 50% 0; animation: v2 1.8s cubic-bezier(.6,0,.4,1) infinite; }
  @keyframes v2 { 0% { transform: scaleY(.2) } 50% { transform: scaleY(1) } 100% { transform: scaleY(.2) } }
  .v3 { background: #d9a05b3d; box-shadow: inset 3px 0 0 #c96f4e; }
  .v3 i.d { width: 6px; height: 6px; border-radius: 50%; background: #c96f4e; opacity: .25;
            animation: v3 1.2s linear infinite; }
  .v3 i.d:nth-child(3) { animation-delay: .2s } .v3 i.d:nth-child(4) { animation-delay: .4s }
  @keyframes v3 { 0%,60%,100% { opacity: .25; transform: translateY(0) } 30% { opacity: 1; transform: translateY(-3px) } }
  .v4 { background: #d9a05b22; animation: v4 3.2s ease-in-out infinite; }
  @keyframes v4 { 0%,100% { box-shadow: inset 0 0 0 1px #c96f4e33 } 50% { box-shadow: inset 0 0 0 2px #c96f4ecc } }
  .v5 { background: #d9a05b3d; box-shadow: inset 3px 0 0 #c96f4e; }
  .v5::after { content: ""; position: absolute; inset: 0;
    background: repeating-linear-gradient(115deg, #c96f4e26 0 8px, #c96f4e00 8px 16px);
    background-size: 200% 100%; animation: v5 2.4s linear infinite; }
  @keyframes v5 { 0% { background-position: 0 0 } 100% { background-position: -64px 0 } }
  .cap { font-size: 10px; letter-spacing: .08em; opacity: .6; margin: 2px 0 10px; }
</style>
</head>
<body>
<h2>1 · 分组配色（每套 12 色，白天 / 夜间各一块）</h2>
<div id="pal"></div>
<h2>2 · 计时中那一行的动效</h2>
<div id="anim"></div>
<script>
var SETS = [
  { id: 'A 奶油糖果 CREAM CANDY', note: '暖底、中等彩度；夜间靠提亮而不是去彩',
    c: ['#C97B63','#3E8E6E','#4A6FA5','#B98F3E','#2E8C9E','#8A5B9E','#C97B2E','#5B5B66','#7FA86B','#D24B3E','#E3B23C','#EADFC8'] },
  { id: 'B 复古蜡笔 CRAYON', note: '彩度最高的一套，小色块也认得出',
    c: ['#D96F4E','#2F7D57','#3C5A9E','#A87C3D','#1F7A78','#7B3F76','#B5651D','#454A55','#6E9E6B','#D1452C','#D9A32B','#E8DCC4'] },
  { id: 'C 靛蓝纸 INDIGO PAPER', note: '整体偏冷，互相之间靠明度拉开',
    c: ['#7A6BD8','#3F8F7E','#4C6FA8','#9C8A62','#2F8FA8','#7E5FA8','#B8734A','#454A5A','#6FA88C','#C4553F','#D4A94F','#E4E1D6'] },
  { id: 'D 果酱 JAM', note: '深而稳，白天对比强、夜间不发灰',
    c: ['#C05B4E','#2F7D57','#3C5A9E','#A87C3D','#1F7A78','#7B3F76','#B5651D','#3E3A45','#6E9E6B','#D1452C','#D9A32B','#E8DCC4'] }
];
var NAMES = ['财务','设计','生活','工作','学习','健康','阅读','运动','旅行','家务','待回','归档'];
/* the app's night rule: same hue, saturation ×0.86, lightness ×1.06+0.06 capped at .70 */
function night(hex) {
  var r = parseInt(hex.slice(1,3),16)/255, g = parseInt(hex.slice(3,5),16)/255, b = parseInt(hex.slice(5,7),16)/255;
  var mx = Math.max(r,g,b), mn = Math.min(r,g,b), l = (mx+mn)/2, d = mx-mn, h = 0, s = d ? d/(1-Math.abs(2*l-1)) : 0;
  h = ((h%360)+360)%360; s = Math.min(1, s*0.86); l = Math.min(0.70, l*1.06+0.06);
  var c = (1-Math.abs(2*l-1))*s, x = c*(1-Math.abs((h/60)%2-1)), m = l-c/2;
  var v = h<60?[c,x,0]:h<120?[x,c,0]:h<180?[0,c,x]:h<240?[0,x,c]:h<300?[x,0,c]:[c,0,x];
  return '#'+v.map(function(n){return ('0'+Math.round((n+m)*255).toString(16)).slice(-2)}).join('');
}
function plate(set, dark) {
  var cols = dark ? set.c.map(night) : set.c;
  var h = '<div class="plate ' + (dark ? 'night' : 'day') + '"><div class="name">' +
    (dark ? '夜间（自动明度/饱和度）' : '白天（存储色）') + '</div><div class="dots">' +
    cols.map(function (c) { return '<span class="dot" style="background:' + c + '"></span>'; }).join('') + '</div>';
  for (var i = 0; i < 5; i++) {
    h += '<div class="item"><span class="dot" style="background:' + cols[i] + '"></span>' +
      '<span class="lbl">' + NAMES[i] + ' · 一条足够长的任务标题用来排版</span>' +
      '<span class="bar"><i style="width:' + (30 + i * 14) + '%;background:' + cols[i] + '"></i></span>' +
      '<span class="v">0' + (i + 2) + ':4' + i + '</span></div>';
  }
  h += '<div class="swatch">' + cols.join(' ') + '</div></div>';
  return h;
}
document.getElementById('pal').innerHTML = SETS.map(function (s) {
  return '<h2 style="margin:14px 0 4px">' + s.id + ' <span style="opacity:.6;font-weight:400">— ' + s.note + '</span></h2>' +
    '<div class="row2">' + plate(s, false) + plate(s, true) + '</div>';
}).join('');

var V = [
  ['v1', '① 底色脉冲（现在这版）', '整行底色在 35%↔100% 之间呼吸，4.6s'],
  ['v2', '② 左标尺伸缩', '底色不动，左边那条随节拍长短变化'],
  ['v3', '③ 行内三点跳动', '像 loading 的三个点，放在标题右侧'],
  ['v4', '④ 描边呼吸', '只有一圈内描边在亮与暗之间变化，最不挡字'],
  ['v5', '⑤ 斜纹流动', '整行铺斜条纹缓慢移动，像进度条在走']
];
document.getElementById('anim').innerHTML = V.map(function (v) {
  var extra = v[0] === 'v3' ? '<i class="d"></i><i class="d"></i><i class="d"></i>' : '';
  return '<div class="cap">' + v[1] + ' — ' + v[2] + '</div>' +
    '<div class="run ' + v[0] + '"><span class="dot" style="background:#4A6FA5"></span>' +
    '<span class="lbl">写周报 · 计时中</span>' + extra + '<span class="v">01:45</span></div>';
}).join('');
</script>
</body>
</html>
