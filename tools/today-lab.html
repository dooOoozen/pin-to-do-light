<!doctype html>
<!-- A static harness for the merged 今日概览 · 统计 plate: the two stylesheets, the same DOM the
     dashboard builds, and the same grid track the module sits in. It exists so the plate's box
     model can be measured without launching the app (which is single-instance and belongs to the
     developer while they work). Open it in a browser at the panel width you want to test. -->
<html data-theme="paper" data-style="blueprint" data-round="on">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../src/theme.css" />
<link rel="stylesheet" href="../src/dashboard.css" />
<style>
  html, body { margin: 0; height: 100%; background: var(--paper); }
  #stage { height: 100%; }
  #probe { position: fixed; right: 8px; top: 8px; z-index: 9999; display: flex; gap: 6px; }
</style>
</head>
<body class="dash">
  <div id="probe">
    <button data-span="2" data-row="1">2/1</button>
    <button data-span="4" data-row="1">4/1</button>
    <button data-span="4" data-row="2">4/2</button>
    <button data-span="6" data-row="2">6/2</button>
  </div>
  <main class="main"><div class="dash-wrap"><div class="dash-grid" id="stage">
    <section class="mod hud" id="modToday" data-mod="today">
      <div class="hud-head mod-head">
        <span class="idx-mark plain">今</span><span class="mtitle"><i class="t-en">TODAY / </i><i class="t-zh">今日概览 · 统计</i></span>
        <span class="spacer"></span><span class="mono faint" id="todayTotal">共 1 项</span>
        <button class="mod-span" type="button">▭</button>
      </div>
      <div class="mod-body mod-today-body">
        <div class="today-body"><div class="today-ring" id="todayRing">
          <i class="today-band" style="background-image: conic-gradient(var(--teal) 0% 0.00%, var(--paper-dim) 0.00% 100%)"></i>
          <b>0%</b><span>0/1</span>
        </div></div>
        <div class="pd-stats" id="dashStats"></div>
        <div class="today-figs" id="todayFigs">
          <div><i>番茄</i><b>0</b></div><div><i>计时</i><b>00:00</b></div>
        </div>
      </div>
    </section>
  </div></div></main>
<script>
  var TILES = [
    { k: 'OPEN / 未完成', zh: '未完成', v: '5', i: '01', key: 'open', tint: 'sage' },
    { k: 'TODAY / 今日到期', zh: '今日到期', v: '1', i: '02', key: 'today', tint: 'honey' },
    { k: 'OVERDUE / 已逾期', zh: '已逾期', v: '0', i: '03', key: 'overdue', tint: 'vermillion' },
    { k: 'DONE / 已完成', zh: '已完成', v: '0', i: '04', key: 'done', tint: 'teal' }
  ];
  document.getElementById('dashStats').innerHTML = TILES.map(function (t) {
    var p = Math.round(Number(t.v) / 6 * 100);
    return '<div class="stat" data-stat="' + t.key + '" style="--tint: var(--' + t.tint + ')">' +
      '  <div class="stat-head"><span class="idx-mark plain">' + t.i + '</span>' +
      '    <span class="k"><i class="k-full">' + t.k + '</i><i class="k-short">' + t.zh + '</i></span>' +
      '    <span class="share">' + p + '%</span></div>' +
      '  <div class="v">' + t.v + '</div>' +
      '  <i class="stat-bar"><b style="width: ' + p + '%"></b></i></div>';
  }).join('');

  function box(n) {
    if (!n) return 'missing';
    var r = n.getBoundingClientRect();
    return Math.round(r.width) + 'x' + Math.round(r.height) + '@' + Math.round(r.left) + ',' + Math.round(r.top);
  }
  window.report = function () {
    var q = function (s) { return document.querySelector(s); };
    var body = q('.mod-today-body'), stats = q('.mod-today-body > .pd-stats');
    var cs = getComputedStyle(body), out = [];
    out.push('mod=' + box(q('#modToday')) + ' body=' + box(body));
    out.push('ring=' + box(q('.today-body')) + ' stats=' + box(stats) + ' figs=' + box(q('.today-figs')));
    out.push('bodyTracks=[' + cs.gridTemplateColumns + ' / ' + cs.gridTemplateRows + ']');
    out.push('statsTracks=[' + getComputedStyle(stats).gridTemplateColumns + ']');
    Array.prototype.forEach.call(document.querySelectorAll('.stat'), function (s) {
      var k = s.querySelector('.k'), v = s.querySelector('.v');
      out.push('  ' + s.dataset.stat + ' ' + box(s) + ' vFont=' + getComputedStyle(v).fontSize +
        ' v=' + box(v) + ' kFont=' + getComputedStyle(k).fontSize +
        ' kScroll=' + k.scrollWidth + '/' + k.clientWidth + ' cut=' + (s.scrollHeight - s.clientHeight));
    });
    return out.join('\n');
  };
  Array.prototype.forEach.call(document.querySelectorAll('#probe button'), function (b) {
    b.addEventListener('click', function () {
      var m = document.getElementById('modToday');
      m.style.gridColumn = 'span ' + b.dataset.span;
      m.style.gridRow = 'span ' + b.dataset.row;
      document.getElementById('out').textContent = window.report();
    });
  });
  window.sweep = function (panelWidth) {
    document.body.style.width = panelWidth + 'px';
    document.documentElement.style.width = panelWidth + 'px';
    var m = document.getElementById('modToday'), out = '';
    [[2, 1], [2, 2], [4, 1], [4, 2], [6, 2]].forEach(function (c) {
      m.style.gridColumn = 'span ' + c[0];
      m.style.gridRow = 'span ' + c[1];
      out += '### panel=' + panelWidth + ' span=' + c[0] + ' row=' + c[1] + '\n' + window.report() + '\n';
    });
    return out;
  };
  var pre = document.createElement('pre');
  pre.id = 'out';
  pre.style.cssText = 'position:fixed;left:8px;bottom:8px;z-index:9999;font:11px/1.5 monospace;margin:0;' +
    'background:#fff;color:#000;border:1px solid #000;max-height:45vh;overflow:auto;padding:6px';
  document.body.appendChild(pre);
  document.querySelector('[data-span="4"][data-row="2"]').click();
</script>
</body>
</html>
